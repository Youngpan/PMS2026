server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: pms-api
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:pms}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # SQL 走 slf4j/logback，受 logback-spring.xml 级别控制（生产 INFO 不打印 SQL）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

pms:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-string-at-least-32-chars}
    expire-minutes: 120
  hotel:
    id: 1
  deposit:
    default: 500
  checkout:
    time: "12:00"
  default-admin:
    password: ${ADMIN_PASSWORD:admin}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  packages-to-scan: com.pms.module
