# 生产 HTTPS 配置：443 SSL + 80 强制跳转。
# 用法：
#   1) 生成证书（本地自签见 scripts/gen-self-signed-cert.sh；生产用 Let's Encrypt / certbot）
#   2) 把证书放到 ./certs/fullchain.pem 与 ./certs/privkey.pem
#   3) docker compose 启动 web 时挂载本文件 + certs 目录
#      volumes:
#        - ./pms-web/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
#        - ./certs:/etc/nginx/certs:ro

server {
    listen 80;
    server_name _;
    # 80 全部 301 跳转到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
