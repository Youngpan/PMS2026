name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api-test:
    name: 后端测试 (mvn test, H2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pms-api
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven 测试
        # 测试类均 @ActiveProfiles("h2")，用 H2 内存库，无需 MySQL 服务。
        run: mvn -B -ntp test

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: pms-api/target/surefire-reports
          if-no-files-found: ignore

  web-build:
    name: 前端构建 (vue-tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pms-web
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pms-web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: pms-web/dist
          if-no-files-found: error
